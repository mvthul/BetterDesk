name: Custom Linux Client Generator
run-name: BetterDesk Real Client ${{ github.event.client_payload.build_id || inputs.build_id }} - ${{ github.event.client_payload.target_id || inputs.target }}
on:
  repository_dispatch:
    types: [linux-x64-deb, linux-x64-appimage, linux-x64-flatpak, linux-arm64-deb, linux-arm64-appimage, linux-arm64-flatpak]
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target architecture and packaging format'
        required: true
        type: string
      payload_url:
        description: 'Encrypted build configuration payload URL'
        required: true
        type: string
      build_id:
        description: 'BetterDesk build dispatch identifier'
        required: true
        type: string

env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.14-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5" 
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "${{ inputs.upload-tag }}"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2024.07.12
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"
  VERSION: "${{ inputs.version }}"
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: 'true'
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}"
  STATUS_URL: "${{ secrets.GENURL }}/updategh"

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      rustdesk: ${{ steps.set.outputs.rustdesk }}
      appimage: ${{ steps.set.outputs.appimage }}
      flatpak: ${{ steps.set.outputs.flatpak }}
    steps:
      - id: set
        run: |
          TARGET="${{ github.event.client_payload.target_id || inputs.target }}"
          if [[ "$TARGET" == *"arm64"* ]]; then
            echo 'rustdesk=[{"arch":"aarch64","target":"aarch64-unknown-linux-gnu","bd_arch":"arm64","on":"ubuntu-22.04-arm"}]' >> $GITHUB_OUTPUT
            echo 'appimage=[{"arch":"aarch64","target":"aarch64-unknown-linux-gnu","bd_arch":"arm64"}]' >> $GITHUB_OUTPUT
            echo 'flatpak=[{"arch":"aarch64","target":"aarch64-unknown-linux-gnu","bd_arch":"arm64","on":"ubuntu-22.04-arm","suffix":"-arm64"}]' >> $GITHUB_OUTPUT
          else
            echo 'rustdesk=[{"arch":"x86_64","target":"x86_64-unknown-linux-gnu","bd_arch":"x64","on":"ubuntu-22.04"}]' >> $GITHUB_OUTPUT
            echo 'appimage=[{"arch":"x86_64","target":"x86_64-unknown-linux-gnu","bd_arch":"x64"}]' >> $GITHUB_OUTPUT
            echo 'flatpak=[{"arch":"x86_64","target":"x86_64-unknown-linux-gnu","bd_arch":"x64","on":"ubuntu-22.04","suffix":""}]' >> $GITHUB_OUTPUT
          fi

  build-rustdesk-linux:
    name: build rustdesk linux ${{ matrix.job.target }}
    needs: setup-matrix
    runs-on: ${{ matrix.job.on }}
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.setup-matrix.outputs.rustdesk) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Decrypt and extract BetterDesk payload
        run: |
          node .betterdesk/decrypt-payload.mjs "${{ github.event.client_payload.payload_url || inputs.payload_url }}" "${{ github.event.client_payload.build_id || inputs.build_id }}"
          node .betterdesk/extract-build-input.mjs
          node .betterdesk/apply-source-patches.mjs .betterdesk-build/input/build-plan.json rustdesk-source

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set rdgen value
        if: ${{ env.rdgen == 'true' }}
        run: |
          echo "STATUS_URL=${{ secrets.GENURL }}/updategh" >> $GITHUB_ENV

      - name: Set rdgen value
        if: ${{ env.rdgen == 'false' }}
        run: |
          echo "STATUS_URL=${{ env.apiServer }}/api/updategh" >> $GITHUB_ENV

      - name: Maximize build space
        run: |
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo apt-get update -y
          sudo apt-get install -y nasm
          if [[ "${{ matrix.job.arch }}" == "x86_64" ]]; then
            sudo apt-get install -y qemu-user-static
          fi
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Checkout source code
        if: ${{ env.VERSION != 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.VERSION }}
          submodules: recursive

      - name: Checkout source code
        if: ${{ env.VERSION == 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          submodules: recursive

      - name: Set Swap Space
        if: ${{ matrix.job.arch == 'x86_64' }}
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Free Space
        run: |
          df -h
          free -m

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - name: Save Rust toolchain version
        run: |
          RUST_TOOLCHAIN_VERSION=$(cargo --version | awk '{print $2}')
          echo "RUST_TOOLCHAIN_VERSION=$RUST_TOOLCHAIN_VERSION" >> $GITHUB_ENV

      - name: Disable rust bridge build
        run: |
          # only build cdylib
          sed -i  "s/\[\"cdylib\", \"staticlib\", \"rlib\"\]/\[\"cdylib\"\]/g" Cargo.toml

      - name: Generate Flutter Bridge
        if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
        run: |
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          cd rustdesk-source
          flutter_rust_bridge_codegen --rust-input src/flutter_ffi.rs --dart-output flutter/lib/generated_bridge.dart

      - name: Setup vcpkg with Github Actions binary cache
        if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
        run: |
          sudo apt install -y libva-dev && apt show libva-dev
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.arch == 'x86_64' && 'x64-linux' || 'arm64-linux' }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.arch == 'x86_64' && 'x64-linux' || 'arm64-linux' }}-rel-out.log" || true
        shell: bash

      - name: icon stuff
        if: ${{ env.iconlink_url != 'false' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          command: |
            mv ./res/icon.ico ./res/icon.ico.bak
            mv ./res/icon.png ./res/icon.png.bak
            mv ./res/tray-icon.ico ./res/tray-icon.ico.bak
            wget -O ./res/icon.png ${{ env.iconlink_url }}/get_png?filename=${{ env.iconlink_file }}"&"uuid=${{ env.iconlink_uuid }}
            mv ./res/32x32.png ./res/32x32.png.bak
            mv ./res/64x64.png ./res/64x64.png.bak
            mv ./res/128x128.png ./res/128x128.png.bak
            mv ./res/128x128@2x.png ./res/128x128@2x.png.bak
            convert ./res/icon.png -define icon:auto-resize=256,64,48,32,16 ./res/icon.ico
            convert ./res/icon.png -define icon:auto-resize=256,64,48,32,16 ./res/tray-icon.ico
            cp ./res/icon.ico ./res/tray-icon.ico
            convert ./res/icon.png -resize 32x32 ./res/32x32.png
            convert ./res/icon.png -resize 64x64 ./res/64x64.png
            convert ./res/icon.png -resize 128x128 ./res/128x128.png
            convert ./res/128x128.png -resize 200% ./res/128x128@2x.png
            cp ./src/ui.rs ./src/ui.rs.bak
            b64=$(base64 < ./res/icon.png)
            sed -i -e 's||$(echo "$b64")|' ./src/ui.rs
            b64=""

            # Embed the PNG into the SVG
            cat <<EOF > ./res/scalable.svg
            <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="$(identify -format "%w" "./res/icon.png")" height="$(identify -format "%h" "./res/icon.png")">
              <image width="$(identify -format "%w" "./res/icon.png")" height="$(identify -format "%h" "./res/icon.png")" xlink:href="data:image/png;base64,$(base64 -w 0 "./res/icon.png")"/>
            </svg>
            EOF

      - name: Build appimage package
        shell: bash
        run: |
          sed -ie "s|rustdesk|${{ env.appname }}|g" appimage/*
          mv appimage/rustdesk.deb "appimage/${{ env.filename }}.deb"

           # install libarchive-tools for bsdtar command used in AppImageBuilder.yml
          sudo apt-get update -y
          # https://github.com/AppImage/AppImageKit/wiki/FUSE
          sudo apt-get install -y libarchive-tools libfuse2
          # set-up appimage-builder
          # https://github.com/AppImage/AppImageKit/issues/1395
          sudo pip3 install "setuptools_scm<10"
          sudo pip3 install git+https://github.com/rustdesk-org/appimage-builder.git
          # run appimage-builder
          pushd appimage
          sudo appimage-builder --skip-tests --recipe ./AppImageBuilder-${{ matrix.job.arch }}.yml
          sudo mv ./${{ env.appname }}-${{ env.VERSION }}-${{ matrix.job.arch }}.AppImage ./${{ env.filename }}-${{ matrix.job.arch }}.AppImage

      - name: Validate and Move Output
        run: |
          mkdir -p .betterdesk-build/out
          node .betterdesk/validate-output.mjs "${{ github.event.client_payload.target_id || inputs.target }}" .betterdesk-build/out || true
          find ./appimage -maxdepth 1 -name "*.AppImage" -exec cp {} .betterdesk-build/out/ \; || true

      - name: Publish one validated package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-client-${{ github.event.client_payload.build_id || inputs.build_id }}
          path: .betterdesk-build/out/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-appimage:
    name: Build appimage ${{ matrix.job.target }}
    if: endsWith(github.event.client_payload.target_id || inputs.target, '-appimage')
    needs: [build-rustdesk-linux, setup-matrix]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.setup-matrix.outputs.appimage) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Decrypt and extract BetterDesk payload
        run: |
          node .betterdesk/decrypt-payload.mjs "${{ github.event.client_payload.payload_url || inputs.payload_url }}" "${{ github.event.client_payload.build_id || inputs.build_id }}"
          node .betterdesk/extract-build-input.mjs
          node .betterdesk/apply-source-patches.mjs .betterdesk-build/input/build-plan.json rustdesk-source

      - name: Checkout source code
        if: ${{ env.VERSION != 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.VERSION }}
          submodules: recursive

      - name: Checkout source code
        if: ${{ env.VERSION == 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          submodules: recursive

      - name: Download Binary
        uses: actions/download-artifact@master
        with:
          name: ${{ env.filename }}-${{ matrix.job.arch }}.deb
          path: .

      - name: Rename Binary
        run: |
          mv ${{ env.filename }}-${{ matrix.job.arch }}.deb appimage/rustdesk.deb

      - name: icon stuff
        if: ${{ env.iconlink_url != 'false' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          command: |
            mv ./res/icon.ico ./res/icon.ico.bak
            mv ./res/icon.png ./res/icon.png.bak
            mv ./res/tray-icon.ico ./res/tray-icon.ico.bak
            wget -O ./res/icon.png ${{ env.iconlink_url }}/get_png?filename=${{ env.iconlink_file }}"&"uuid=${{ env.iconlink_uuid }}
            mv ./res/32x32.png ./res/32x32.png.bak
            mv ./res/64x64.png ./res/64x64.png.bak
            mv ./res/128x128.png ./res/128x128.png.bak
            mv ./res/128x128@2x.png ./res/128x128@2x.png.bak
            convert ./res/icon.png -define icon:auto-resize=256,64,48,32,16 ./res/icon.ico
            convert ./res/icon.png -define icon:auto-resize=256,64,48,32,16 ./res/tray-icon.ico
            cp ./res/icon.ico ./res/tray-icon.ico
            convert ./res/icon.png -resize 32x32 ./res/32x32.png
            convert ./res/icon.png -resize 64x64 ./res/64x64.png
            convert ./res/icon.png -resize 128x128 ./res/128x128.png
            convert ./res/128x128.png -resize 200% ./res/128x128@2x.png
            cp ./src/ui.rs ./src/ui.rs.bak
            b64=$(base64 < ./res/icon.png)
            sed -i -e 's||$(echo "$b64")|' ./src/ui.rs
            b64=""

            # Embed the PNG into the SVG
            cat <<EOF > ./res/scalable.svg
            <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="$(identify -format "%w" "./res/icon.png")" height="$(identify -format "%h" "./res/icon.png")">
              <image width="$(identify -format "%w" "./res/icon.png")" height="$(identify -format "%h" "./res/icon.png")" xlink:href="data:image/png;base64,$(base64 -w 0 "./res/icon.png")"/>
            </svg>
            EOF

      - name: Build appimage package
        shell: bash
        run: |
          sed -ie "s|rustdesk|${{ env.appname }}|g" appimage/*
          mv appimage/rustdesk.deb "appimage/${{ env.filename }}.deb"

           # install libarchive-tools for bsdtar command used in AppImageBuilder.yml
          sudo apt-get update -y
          # https://github.com/AppImage/AppImageKit/wiki/FUSE
          sudo apt-get install -y libarchive-tools libfuse2
          # set-up appimage-builder
          # https://github.com/AppImage/AppImageKit/issues/1395
          sudo pip3 install "setuptools_scm<10"
          sudo pip3 install git+https://github.com/rustdesk-org/appimage-builder.git
          # run appimage-builder
          pushd appimage
          sudo appimage-builder --skip-tests --recipe ./AppImageBuilder-${{ matrix.job.arch }}.yml
          sudo mv ./${{ env.appname }}-${{ env.VERSION }}-${{ matrix.job.arch }}.AppImage ./${{ env.filename }}-${{ matrix.job.arch }}.AppImage

      - name: Validate and Move Output
        run: |
          mkdir -p .betterdesk-build/out
          node .betterdesk/validate-output.mjs "${{ github.event.client_payload.target_id || inputs.target }}" .betterdesk-build/out || true
          find ./appimage -maxdepth 1 -name "*.AppImage" -exec cp {} .betterdesk-build/out/ \; || true

      - name: Publish one validated package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-client-${{ github.event.client_payload.build_id || inputs.build_id }}
          path: .betterdesk-build/out/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-flatpak:
    name: Build flatpak ${{ matrix.job.target }}${{ matrix.job.suffix }}
    if: endsWith(github.event.client_payload.target_id || inputs.target, '-flatpak')
    needs:
      - build-rustdesk-linux
      - setup-matrix
    runs-on: ${{ matrix.job.on }}
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.setup-matrix.outputs.flatpak) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - uses: actions/download-artifact@v4
        with:
          name: encrypted-secrets-zip

      - name: Load Secrets
        uses: ./.github/actions/decrypt-secrets
        with:
          zip_password: ${{ secrets.ZIP_PASSWORD }}

      - name: Checkout source code
        if: ${{ env.VERSION != 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.VERSION }}
          submodules: recursive

      - name: Checkout source code
        if: ${{ env.VERSION == 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          submodules: recursive

      - name: Download Binary
        uses: actions/download-artifact@master
        with:
          name: ${{ env.filename }}-${{ matrix.job.arch }}.deb
          path: .

      - name: Rename Binary
        run: |
          mv ${{ env.filename }}-${{ matrix.job.arch }}.deb flatpak/rustdesk.deb

      - uses: rustdesk-org/run-on-arch-action@amd64-support
        name: Build rustdesk flatpak package for ${{ matrix.job.arch }}
        continue-on-error: true
        timeout-minutes: 30
        id: flatpak
        with:
          arch: ${{ matrix.job.arch }}
          distro: ${{ matrix.job.distro }}
          githubToken: ${{ github.token }}
          setup: |
            ls -l "${PWD}"
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
          shell: /bin/bash
          install: |
            apt-get update -y
            apt-get install -y git flatpak flatpak-builder
          run: |
            # disable git safe.directory
            git config --global --add safe.directory "*"
            pushd /workspace
            # flatpak deps
            flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
            # package
            pushd flatpak
            git clone https://github.com/flathub/shared-modules.git --depth=1
            flatpak-builder --user --install-deps-from=flathub -y --force-clean --repo=repo ./build ./rustdesk.json
            flatpak build-bundle ./repo ${{ env.filename }}-${{ matrix.job.arch }}.flatpak com.rustdesk.RustDesk

      - name: Validate and Move Output
        run: |
          mkdir -p .betterdesk-build/out
          node .betterdesk/validate-output.mjs "${{ github.event.client_payload.target_id || inputs.target }}" .betterdesk-build/out || true
          find ./flatpak -maxdepth 1 -name "*.flatpak" -exec cp {} .betterdesk-build/out/ \; || true

      - name: Publish one validated package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-client-${{ github.event.client_payload.build_id || inputs.build_id }}
          path: .betterdesk-build/out/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
